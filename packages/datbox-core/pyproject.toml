[project]
name = "datbox-core"
version = "0.0.1"
description = "Core of the Data Analyst Toolbox: the `dat` CLI, plugin registry, config, secrets, and output writers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Nick Hebert" }]
keywords = ["data", "analytics", "cli", "toolbox"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.urls]
Homepage = "https://github.com/nick-hebert/datbox"
Repository = "https://github.com/nick-hebert/datbox"
Issues = "https://github.com/nick-hebert/datbox/issues"

[project.scripts]
dat = "datbox_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datbox_core"]
