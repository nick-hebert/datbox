[project]
name = "datbox-viz"
version = "0.0.1"
description = "dat viz: YAML + DuckDB/Parquet/CSV -> a single self-contained HTML dashboard."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Nick Hebert" }]
keywords = ["data", "analytics", "dashboard", "html", "duckdb", "polars"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "datbox-core>=0.0.1",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/nick-hebert/datbox"
Repository = "https://github.com/nick-hebert/datbox"
Issues = "https://github.com/nick-hebert/datbox/issues"

[project.entry-points."datbox.plugins"]
viz = "datbox_viz.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datbox_viz"]
