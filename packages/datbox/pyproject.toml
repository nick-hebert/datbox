[project]
name = "datbox"
version = "0.0.1"
description = "dat, the Data Analyst Toolbox: portable, zero-infrastructure utilities for data analysts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Nick Hebert" }]
keywords = ["data", "analytics", "cli", "toolbox", "dashboard"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "datbox-core>=0.0.1",
]

[project.urls]
Homepage = "https://github.com/nick-hebert/datbox"
Repository = "https://github.com/nick-hebert/datbox"
Issues = "https://github.com/nick-hebert/datbox/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datbox"]
